<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="enamel" x2=".8" y2="1">
      <stop stop-color="#dedfdd"/><stop offset="1" stop-color="#bfc4c5"/>
    </linearGradient>
    <pattern id="grille" width="91" height="91" patternUnits="userSpaceOnUse" patternTransform="rotate(2)">
      <circle cx="36" cy="37" r="24" fill="#8f9493"/>
      <circle cx="35" cy="34" r="21" fill="#343939"/>
      <path d="M15 31H55M32 14V54" stroke="#b9bfbc" stroke-width="4"/>
      <path d="M15 35A21 21 0 0 1 36 14" fill="none" stroke="#edf0eb" stroke-width="3" opacity=".7"/>
    </pattern>
    <linearGradient id="rim" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#b6b5a4"/><stop offset=".5" stop-color="#aaa995"/><stop offset="1" stop-color="#9c9f8b"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#999b88"/><stop offset=".5" stop-color="#a6a793"/><stop offset="1" stop-color="#b6b7a2"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#b5b5b6"/><stop offset="1" stop-color="#a5a6a6"/>
    </linearGradient>
    <radialGradient id="outer-recess" gradientUnits="userSpaceOnUse" cx="520" cy="395" r="529">
      <stop offset=".86" stop-color="#252a26" stop-opacity="0"/>
      <stop offset=".94" stop-color="#252a26" stop-opacity=".12"/>
      <stop offset=".985" stop-color="#252a26" stop-opacity=".38"/>
      <stop offset="1" stop-color="#252a26" stop-opacity=".58"/>
    </radialGradient>
    <radialGradient id="inner-recess" gradientUnits="userSpaceOnUse" cx="520" cy="395" r="218">
      <stop offset=".79" stop-color="#252a26" stop-opacity=".5"/>
      <stop offset=".84" stop-color="#252a26" stop-opacity=".34"/>
      <stop offset=".92" stop-color="#252a26" stop-opacity=".1"/>
      <stop offset="1" stop-color="#252a26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-edge" x1=".2" y1="0" x2=".7" y2="1">
      <stop stop-color="#e8e7e3"/><stop offset=".55" stop-color="#c8c9c5"/><stop offset="1" stop-color="#a5a8a4"/>
    </linearGradient>
    <radialGradient id="cap" cx=".32" cy=".23" r=".92">
      <stop stop-color="#f0efec"/><stop offset=".65" stop-color="#e5e4e1"/><stop offset="1" stop-color="#d5d6d2"/>
    </radialGradient>
    <linearGradient id="cap-highlight" x1=".2" y1="0" x2=".75" y2="1">
      <stop stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
