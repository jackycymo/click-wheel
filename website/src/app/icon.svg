<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A click wheel: ring, hub, and an index notch at twelve o'clock. -->
  <!-- Colors live on the shapes so any renderer draws the light variant; the style block inverts it for dark tabs. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fafafa; }
      .ring { stroke: #09090b; }
      .hub { fill: #09090b; }
      .notch { stroke: #fafafa; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" fill="#09090b" />
  <circle class="ring" cx="16" cy="16" r="9.25" fill="none" stroke="#fafafa" stroke-width="2.5" />
  <circle class="hub" cx="16" cy="16" r="3.25" fill="#fafafa" />
  <path class="notch" d="M16 5v4" stroke="#09090b" stroke-width="2" />
</svg>
